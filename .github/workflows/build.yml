name: Build Mod JAR

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build & Artifact Upload
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Read Java Version from gradle.properties
        run: |
          JAVA_VER=$(grep "^java_version=" gradle.properties | cut -d'=' -f2 | xargs)
          echo "JAVA_VERSION=${JAVA_VER:-21}" >> $GITHUB_ENV

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle (Optimized)
        run: ./gradlew build --no-daemon --parallel --build-cache

      - name: Upload Mod JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DragonMountsRemastered-JAR
          path: build/libs/*.jar
          retention-days: 14
